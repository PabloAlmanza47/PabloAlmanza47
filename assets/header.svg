<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Pablo Almanza</title>
  <desc id="d">Software engineer and Computer Science student at Texas A&amp;M, class of 2028. A terminal window lists his projects: SHPE Connect, Terminal Home, and the TAMU SHPE website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12296A"/>
      <stop offset="1" stop-color="#0B1A47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
      .line { opacity: 0; animation: cycle 12s ease-in-out infinite; }
      .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
      .draw { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 1.6s 0.3s ease-out forwards; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      .tw { transform-origin: center; transform-box: fill-box; animation: twinkle 3.2s ease-in-out infinite; }
      .tw2 { animation-delay: 1.4s; }
      .t { opacity: 0; animation: show 0.25s ease-out forwards; }
      .t1 { animation-delay: 0.6s; } .t2 { animation-delay: 1.3s; } .t3 { animation-delay: 2.1s; }
      .t4 { animation-delay: 2.8s; } .t5 { animation-delay: 3.6s; }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(10px); }
        4%, 21% { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(0.72) rotate(18deg); } }
      @keyframes show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .line, .draw, .blink, .tw, .t { animation: none; }
        .l1, .t { opacity: 1; } .draw { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- terminal window -->
    <g transform="rotate(2 955 190)">
      <rect x="776" y="78" width="372" height="236" rx="14" fill="#040B22" fill-opacity="0.35"/>
      <rect x="768" y="68" width="372" height="236" rx="14" fill="#081230" stroke="#F4EDDC" stroke-opacity="0.22" stroke-width="1.5"/>
      <path d="M 768 106 H 1140" stroke="#F4EDDC" stroke-opacity="0.14"/>
      <circle cx="792" cy="87" r="6" fill="#F4EDDC" fill-opacity="0.85"/>
      <circle cx="812" cy="87" r="6" fill="#5C8DFF"/>
      <circle cx="832" cy="87" r="6" fill="#2F6BFF"/>
      <text x="954" y="92" text-anchor="middle" class="mono" font-size="13" fill="#8FB0FF">pablo@tamu: ~</text>
      <g class="mono" font-size="14.5">
        <text x="788" y="140" class="t t1"><tspan fill="#5C8DFF" font-weight="700">$</tspan><tspan fill="#F4EDDC"> whoami</tspan></text>
        <text x="788" y="166" class="t t2" fill="#8FB0FF">pablo · software engineer</text>
        <text x="788" y="204" class="t t3"><tspan fill="#5C8DFF" font-weight="700">$</tspan><tspan fill="#F4EDDC"> ls projects/</tspan></text>
        <text x="788" y="230" class="t t4" fill="#8FB0FF">shpe-connect  terminal-home  tamu-shpe</text>
        <g class="t t5">
          <text x="788" y="268" fill="#5C8DFF" font-weight="700">$</text>
          <rect class="blink" x="806" y="254" width="10" height="18" fill="#F4EDDC"/>
        </g>
      </g>
    </g>

    <!-- sparkles -->
    <path class="tw" d="M 722 52 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 z" fill="#F4EDDC"/>
    <path class="tw tw2" d="M 716 296 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 z" fill="#7FA6FF"/>

    <!-- text -->
    <text x="72" y="96" class="mono" font-size="17" letter-spacing="4" fill="#8FB0FF">COMPUTER SCIENCE  ·  TEXAS A&amp;M ’28</text>
    <text x="68" y="192" class="sans" font-size="92" font-weight="800" letter-spacing="-2" fill="#F4EDDC">Pablo Almanza</text>
    <path class="draw" d="M 72 218 C 170 204, 250 232, 340 216 S 520 206, 668 220" fill="none" stroke="#2F6BFF" stroke-width="7" stroke-linecap="round"/>

    <text x="72" y="274" class="mono" font-size="27" font-weight="700" fill="#5C8DFF">›</text>
    <g class="mono" font-size="27" fill="#F4EDDC">
      <text x="100" y="274" class="line l1">Software Engineer @ PowerDB</text>
      <text x="100" y="274" class="line l2">Full-stack products, end to end</text>
      <text x="100" y="274" class="line l3">Terminal tools for developers</text>
      <text x="100" y="274" class="line l4">Always building something new</text>
    </g>

    <text x="72" y="330" class="mono" font-size="16" letter-spacing="1.5" fill="#8FB0FF">madebypablo.dev   ·   github.com/PabloAlmanza47</text>
  </g>
</svg>