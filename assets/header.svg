<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Pablo Almanza</title>
  <desc id="d">Software engineer and Computer Science student at Texas A&amp;M, class of 2028. A spinning record labelled Made by Pablo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12296A"/>
      <stop offset="1" stop-color="#0B1A47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
    <path id="labelArc" d="M 960 190 m -41 0 a 41 41 0 1 1 82 0 a 41 41 0 1 1 -82 0"/>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
      .spin { transform-origin: 960px 190px; animation: spin 16s linear infinite; }
      .line { opacity: 0; animation: cycle 12s ease-in-out infinite; }
      .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
      .draw { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 1.6s 0.3s ease-out forwards; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      .tw { transform-origin: center; transform-box: fill-box; animation: twinkle 3.2s ease-in-out infinite; }
      .tw2 { animation-delay: 1.4s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(10px); }
        4%, 21% { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(0.72) rotate(18deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spin, .line, .draw, .blink, .tw { animation: none; }
        .l1 { opacity: 1; } .draw { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- record -->
    <g class="spin">
      <circle cx="960" cy="190" r="152" fill="#070F2B"/>
      <g fill="none" stroke="#F4EDDC" stroke-opacity="0.13">
        <circle cx="960" cy="190" r="142"/><circle cx="960" cy="190" r="131"/>
        <circle cx="960" cy="190" r="120"/><circle cx="960" cy="190" r="109"/>
        <circle cx="960" cy="190" r="98"/><circle cx="960" cy="190" r="87"/>
        <circle cx="960" cy="190" r="76"/>
      </g>
      <path d="M 960 38 A 152 152 0 0 1 1112 190 L 1026 190 A 66 66 0 0 0 960 124 Z" fill="#F4EDDC" fill-opacity="0.05"/>
      <path d="M 960 342 A 152 152 0 0 1 808 190 L 894 190 A 66 66 0 0 0 960 256 Z" fill="#F4EDDC" fill-opacity="0.05"/>
      <circle cx="960" cy="190" r="60" fill="#2F6BFF"/>
      <circle cx="960" cy="190" r="53" fill="none" stroke="#F4EDDC" stroke-opacity="0.55" stroke-width="1.5"/>
      <text class="mono" font-size="11.5" font-weight="700" letter-spacing="2.4" fill="#F4EDDC">
        <textPath href="#labelArc">MADE BY PABLO  ·  SIDE A  ·</textPath>
      </text>
      <circle cx="960" cy="190" r="20" fill="#F4EDDC"/>
      <circle cx="960" cy="190" r="6" fill="#0B1A47"/>
    </g>
    <!-- tonearm -->
    <g stroke="#F4EDDC" stroke-linecap="round" fill="none">
      <circle cx="1138" cy="52" r="15" fill="#F4EDDC" stroke="none"/>
      <circle cx="1138" cy="52" r="5" fill="#12296A" stroke="none"/>
      <path d="M 1138 52 L 1094 150 L 1058 176" stroke-width="7"/>
      <rect x="1034" y="166" width="34" height="18" rx="4" transform="rotate(36 1051 175)" fill="#F4EDDC" stroke="none"/>
    </g>

    <!-- sparkles -->
    <path class="tw" d="M 742 62 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 z" fill="#F4EDDC"/>
    <path class="tw tw2" d="M 786 300 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 z" fill="#7FA6FF"/>

    <!-- text -->
    <text x="72" y="96" class="mono" font-size="17" letter-spacing="4" fill="#8FB0FF">SIDE A  ·  COMPUTER SCIENCE  ·  TEXAS A&amp;M ’28</text>
    <text x="68" y="192" class="sans" font-size="92" font-weight="800" letter-spacing="-2" fill="#F4EDDC">Pablo Almanza</text>
    <path class="draw" d="M 72 218 C 170 204, 250 232, 340 216 S 520 206, 668 220" fill="none" stroke="#2F6BFF" stroke-width="7" stroke-linecap="round"/>

    <text x="72" y="274" class="mono blink" font-size="27" font-weight="700" fill="#5C8DFF">›</text>
    <g class="mono" font-size="27" fill="#F4EDDC">
      <text x="100" y="274" class="line l1">Software Engineer @ PowerDB</text>
      <text x="100" y="274" class="line l2">Full-stack products, end to end</text>
      <text x="100" y="274" class="line l3">Terminal tools for developers</text>
      <text x="100" y="274" class="line l4">Always building something new</text>
    </g>

    <text x="72" y="330" class="mono" font-size="16" letter-spacing="1.5" fill="#8FB0FF">madebypablo.dev   ·   github.com/PabloAlmanza47</text>
  </g>
</svg>
