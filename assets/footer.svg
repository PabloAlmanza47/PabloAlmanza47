<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="ft">
  <title id="ft">Building software that helps people connect, create, and work more effectively.</title>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1A47"/><stop offset="0.5" stop-color="#12296A"/><stop offset="1" stop-color="#0B1A47"/>
    </linearGradient>
    <style>
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      .tw { transform-origin: center; transform-box: fill-box; animation: twinkle 3.2s ease-in-out infinite; }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(0.72) rotate(18deg); } }
      @media (prefers-reduced-motion: reduce) { .blink, .tw { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="120" rx="24" fill="url(#fbg)"/>
  <text x="64" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="28" font-weight="700" fill="#5C8DFF">›</text>
  <rect class="blink" x="90" y="48" width="13" height="26" fill="#F4EDDC"/>
  <path class="tw" d="M 1118 38 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 z" fill="#F4EDDC"/>
  <text x="600" y="68" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#F4EDDC">Building software that helps people connect, create, and work more effectively.</text>
</svg>